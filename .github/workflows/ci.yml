# Builds and tests every module in the workspace on each push and pull
# request — the check `gh codecrew task finish` gates on. Mirrors the
# release workflow's conventions: official actions only, pinned to their
# current major, Go toolchain from go.mod.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The signal module is skipped for the same reason the kernel's CI
      # runs test-portable instead of test: its suite needs CGO_ENABLED=1
      # against the system SQLCipher library (-tags libsqlcipher) — a
      # dependency this runner has no reason to install. It is proven
      # locally on the operator's machine instead (task #3, plan step 6).
      - name: Build and test every workspace module (except signal)
        run: |
          set -euo pipefail
          for mod in $(go list -m -f '{{.Dir}}' | tr -d '\r'); do
            case "$mod" in */plugins/signal) echo "=== plugins/signal: skipped (cgo/SQLCipher — local-only)"; continue;; esac
            echo "=== ${mod#$PWD/}"
            (cd "$mod" && go build ./... && go test ./...)
          done
