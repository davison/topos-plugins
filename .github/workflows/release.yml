# Publishes a tagged GitHub Release carrying the static plugin fleet, its
# ed25519-signed release manifest, and the provenance verifier itself —
# the artifacts `make install` in this repository downloads, verifies
# and places (davison/topos#6, M1-R5). Signed provenance is what lets
# the topos kernel accept these binaries as first-party trusted with no
# link-time build-manifest entry (davison/topos docs/plugin-trust.md).
#
# Triggered by pushing a tag matching v*.*.*.
#
# The fleet is built by `make build` and the verifier by `make verifier`
# — the plugin list (STATIC_PLUGINS) and the kernel revision the
# verifier is pinned at (TOPOS_PROVENANCE_REF) each live in exactly one
# place, and this workflow never re-types either. The signing step runs
# that pinned verifier, never @latest, so this pipeline can never
# silently pick up a changed manifest format or signing scheme. The
# signing key is referenced exactly twice below (the env: key and its
# secrets. value), passed only through the environment, and never
# appears in argv or in any echoed/debug output — no shell trace flag
# is enabled anywhere in this job.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 (inside both targets) matches the kernel's static
      # release discipline. The signal plugin is deliberately absent: it
      # dynamically links the system SQLCipher library, so a binary
      # built on this runner's Ubuntu is not guaranteed to run on your
      # distro — build it locally with `make build-signal`. The demo
      # plugin (cmd/topos-plugin-demo) is not shipped either: it exists
      # to give CI and the install smoke test a fixture plugin, not to
      # appear in an operator's source picker.
      - name: Build the static fleet and the pinned verifier
        run: |
          make build
          make verifier

      # --contract records the fleet's contract GENERATION — topos.v2,
      # the value every binary here declares at Describe
      # (sdk.ContractVersion in davison/topos; releases before v0.3.1
      # recorded topos.v1 by mistake, harmless because the kernel's
      # launch gate reads the runtime Describe declaration, never this
      # recorded field — Decision on davison/topos#17).
      #
      # The signing key is referenced exactly twice in this step: once as
      # the env: key (TOPOS_PROVENANCE_SIGNING_KEY) and once as its
      # secrets. value. It is never passed as a --flag (where it would
      # appear in a process listing) and never echoed. The signer is the
      # verifier `make verifier` just built at TOPOS_PROVENANCE_REF.
      - name: Sign the release manifest
        env:
          TOPOS_PROVENANCE_SIGNING_KEY: ${{ secrets.TOPOS_PROVENANCE_SIGNING_KEY }}
        run: |
          ./bin/topos-provenance sign \
            --key-id topos-plugins-2026a \
            --repo davison/topos-plugins \
            --tag "$GITHUB_REF_NAME" \
            --version "$GITHUB_REF_NAME" \
            --contract topos.v2 \
            --out-dir bin \
            bin/topos-plugin-*

      # checksums.txt is written over exactly the set published below —
      # it is the asset list `make install` derives its downloads from,
      # so the two are produced from the same globs in the same step.
      - name: Hash and publish release assets
        run: |
          (cd bin && sha256sum topos-plugin-* topos-provenance topos-plugins-*.provenance.json topos-plugins-*.provenance.sig > checksums.txt)
          gh release create "$GITHUB_REF_NAME" \
            bin/topos-plugin-* \
            bin/topos-provenance \
            bin/topos-plugins-*.provenance.json \
            bin/topos-plugins-*.provenance.sig \
            bin/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "topos-plugins release — the static plugin fleet (filesystem, gdrive, paperless, proton, silverbullet, whatsapp) with its signed provenance manifest and the topos-provenance verifier. Install with \`make install\` from a checkout of this repository (README.md, \"Installing the fleet\"). Signal is not shipped prebuilt: it dynamically links the system SQLCipher library — \`make build-signal\` from the checkout." \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
